name: mytrading
description: "Sangga's trading application"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1  # State Management
  dio: ^5.4.0               # Koneksi API
  intl: ^0.19.0             # Format Rupiah
  phosphor_flutter: ^1.1.0  # Ikon Modern
  google_fonts: ^6.1.0      # Font Keren
  flutter_slidable: ^4.0.3
  shared_preferences: ^2.5.3
  cloud_firestore: ^5.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_apps.png"
  min_sdk_android: 24
  adaptive_icon_background: "#af661a"
  adaptive_icon_foreground: "assets/images/logo_apps.png"

  #delete mipmap-anydpi-v26 in android
